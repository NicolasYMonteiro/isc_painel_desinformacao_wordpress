# Kibana — embed no WordPress (ADR-001 / TASK-004)
server.host: "0.0.0.0"
server.publicBaseUrl: "http://localhost:5601"
elasticsearch.hosts: ["http://elasticsearch:9200"]

server.securityResponseHeaders.disableEmbedding: false
csp.frame_ancestors: ["'self'", "http://localhost:8080"]

# Demo: sem telemetria / newsfeed / aviso de cluster inseguro no iframe
telemetry.enabled: false
newsfeed.enabled: false
security.showInsecureClusterWarning: false
